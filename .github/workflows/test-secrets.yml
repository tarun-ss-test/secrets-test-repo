name: Test secrets

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  use-org-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check org secret is available
        env:
          ORG_TOKEN: ${{ secrets.ORG_DEPLOY_TOKEN }}
        run: |
          if [ -n "$ORG_TOKEN" ]; then
            echo "ORG_DEPLOY_TOKEN is available"
          else
            echo "ORG_DEPLOY_TOKEN is missing"
            exit 1
          fi

  use-repo-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check repo secret is available
        env:
          REPO_KEY: ${{ secrets.REPO_API_KEY }}
        run: |
          if [ -n "$REPO_KEY" ]; then
            echo "REPO_API_KEY is available"
          else
            echo "REPO_API_KEY is missing"
            exit 1
          fi
