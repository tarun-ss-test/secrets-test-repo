name: Input picks the secret

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Which secret number to use"
        type: choice
        options: ["1", "2", "3"]
        default: "1"

permissions:
  contents: read

jobs:
  use-chosen-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check chosen org and repo secret
        env:
          ORG_VALUE: ${{ secrets[format('ORG_SECRET_{0}', inputs.n)] }}
          REPO_VALUE: ${{ secrets[format('REPO_SECRET_{0}', inputs.n)] }}
        run: |
          [ -n "$ORG_VALUE" ] && echo "ORG_SECRET_${{ inputs.n }} available" || echo "ORG_SECRET_${{ inputs.n }} missing"
          [ -n "$REPO_VALUE" ] && echo "REPO_SECRET_${{ inputs.n }} available" || echo "REPO_SECRET_${{ inputs.n }} missing"
