name: Test secrets

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: "Environment for the dynamic job"
        type: choice
        options: [production, staging]
        default: staging

permissions:
  contents: read

jobs:
  # Job with NO environment: gets repo or org secrets only
  no-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          ORG_TOKEN: ${{ secrets.ORG_DEPLOY_TOKEN }}
          REPO_KEY: ${{ secrets.REPO_API_KEY }}
          DEPLOY: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          [ -n "$ORG_TOKEN" ] && echo "ORG_DEPLOY_TOKEN available" || echo "ORG_DEPLOY_TOKEN missing"
          [ -n "$REPO_KEY" ] && echo "REPO_API_KEY available" || echo "REPO_API_KEY missing"
          [ -n "$DEPLOY" ] && echo "DEPLOY_TOKEN available (repo/org level)" || echo "DEPLOY_TOKEN missing"

  # Fixed environment: production
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check secret
        env:
          DEPLOY: ${{ secrets.DEPLOY_TOKEN }}
        run: '[ -n "$DEPLOY" ] && echo "production DEPLOY_TOKEN available" || echo "missing"'

  # Fixed environment: staging
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check secret
        env:
          DEPLOY: ${{ secrets.DEPLOY_TOKEN }}
        run: '[ -n "$DEPLOY" ] && echo "staging DEPLOY_TOKEN available" || echo "missing"'

  # Dynamic environment: decided at run time (should show as "Possible")
  deploy-dynamic:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'staging' }}
    steps:
      - name: Check secret
        env:
          DEPLOY: ${{ secrets.DEPLOY_TOKEN }}
        run: '[ -n "$DEPLOY" ] && echo "dynamic DEPLOY_TOKEN available" || echo "missing"'

  # Reusable workflow: environment is set INSIDE the called workflow
  call-reusable:
    uses: ./.github/workflows/reusable-deploy.yml
    secrets: inherit
